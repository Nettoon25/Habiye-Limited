
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Product Details | Habiye Limited
  </title>

  <meta
    name="description"
    content="View detailed product information and recommendations from Habiye Limited."
  >

  <!-- MAIN WEBSITE STYLES -->
  <link
    rel="stylesheet"
    href="style.css"
  >


  <style>

    /* =========================
       PRODUCT DETAILS PAGE
    ========================== */

    .product-page {

      max-width: 1200px;

      margin: 0 auto;

      padding: 60px 20px;

    }


    .back-link {

      display: inline-block;

      margin-bottom: 30px;

      text-decoration: none;

      font-weight: 600;

    }


    .product-details {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 50px;

      align-items: start;

    }


    .product-main-image {

      width: 100%;

      max-height: 550px;

      object-fit: cover;

      border-radius: 16px;

      display: block;

    }


    .product-details .product-category {

      display: inline-block;

      margin-right: 10px;

    }


    .product-details .product-tag {

      position: static;

      display: inline-block;

      margin-left: 5px;

    }


    .product-details h1 {

      margin: 15px 0;

      font-size: 42px;

      line-height: 1.15;

    }


    .product-details .rating {

      margin-bottom: 20px;

      font-size: 18px;

    }


    .product-details .description {

      font-size: 17px;

      line-height: 1.7;

      margin-bottom: 25px;

    }


    .product-full-details {

      margin-bottom: 25px;

      padding: 20px;

      border-radius: 12px;

      background: rgba(0, 0, 0, 0.04);

    }


    .product-full-details strong {

      display: block;

      margin-bottom: 10px;

    }


    .product-full-details p {

      margin: 0;

      line-height: 1.7;

    }


    .product-details .main-product-price {

      display: block;

      font-size: 30px;

      margin-bottom: 25px;

      font-weight: 900;

    }


    /* =========================
       PURCHASE CONTROLS
    ========================== */

    .purchase-controls {

      display: flex;

      align-items: center;

      gap: 15px;

      margin-bottom: 35px;

    }


    .quantity-control {

      display: flex;

      align-items: center;

      gap: 15px;

      border: 1px solid #ddd;

      border-radius: 8px;

      padding: 5px 10px;

      background: white;

    }


    .quantity-control button {

      border: none;

      background: transparent;

      font-size: 22px;

      cursor: pointer;

      padding: 5px 10px;

    }


    .quantity-control span {

      min-width: 25px;

      text-align: center;

      font-weight: 600;

    }


    /* =========================
       CUSTOMIZATION
    ========================== */

    .customization-section {

      margin-top: 30px;

    }


    .customization-section h3 {

      margin-bottom: 15px;

    }


    .customization-placeholder {

      padding: 20px;

      border: 1px dashed #ccc;

      border-radius: 12px;

      line-height: 1.7;

    }


    /* =========================
       RECOMMENDED PRODUCTS
       
       These use the SAME
       product-card CSS from
       style.css.
    ========================== */

    .recommended-section {

      margin-top: 80px;

    }


    .recommended-section .section-heading {

      margin-bottom: 35px;

    }


    .recommended-grid {

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 22px;

      align-items: stretch;

    }


    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 1000px) {

      .recommended-grid {

        grid-template-columns:
          repeat(3, minmax(0, 1fr));

      }

    }


    @media (max-width: 900px) {

      .product-details {

        grid-template-columns: 1fr;

      }


      .recommended-grid {

        grid-template-columns:
          repeat(2, minmax(0, 1fr));

      }

    }


    @media (max-width: 600px) {

      .product-page {

        padding: 40px 15px;

      }


      .product-details h1 {

        font-size: 32px;

      }


      .purchase-controls {

        flex-direction: column;

        align-items: stretch;

      }


      .quantity-control {

        justify-content: center;

      }


      .recommended-grid {

        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 10px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       DYNAMIC HEADER
  ========================== -->

  <div id="site-header"></div>


  <!-- =========================
       PRODUCT PAGE
  ========================== -->

  <main class="product-page">


    <!-- =========================
         BACK TO PRODUCTS
    ========================== -->

    <a
      href="index.html"
      class="back-link"
    >

      ← Back to Products

    </a>


    <!-- =========================
         PRODUCT DETAILS
    ========================== -->

    <section
      class="product-details"
      id="productDetails"
    >

      <!-- JavaScript inserts
           selected product here -->

    </section>


    <!-- =========================
         RECOMMENDED PRODUCTS
    ========================== -->

    <section
      class="recommended-section"
      id="recommendedSection"
    >


      <div class="section-heading">

        <h2>
          You May Also Like
        </h2>

        <p>
          Explore more products from Habiye Limited.
        </p>

      </div>


      <div
        class="recommended-grid"
        id="recommendedGrid"
      >

        <!-- JavaScript inserts
             recommended products here -->

      </div>


    </section>


  </main>


  <!-- =========================
       DYNAMIC FOOTER
  ========================== -->

  <div id="site-footer"></div>


  <!-- =========================
       JAVASCRIPT FILES
  ========================== -->

  <script src="products.js"></script>

  <script src="components.js"></script>

  <script src="cart.js"></script>


  <!-- =========================
       PRODUCT PAGE SCRIPT
  ========================== -->

  <script>

    document.addEventListener(
      "DOMContentLoaded",
      () => {


        /* =========================
           GET PAGE ELEMENTS
        ========================== */

        const productDetails =
          document.getElementById(
            "productDetails"
          );


        const recommendedGrid =
          document.getElementById(
            "recommendedGrid"
          );


        /* =========================
           GET PRODUCT ID
        ========================== */

        const urlParams =
          new URLSearchParams(
            window.location.search
          );


        const productId =
          Number(
            urlParams.get("id")
          );


        /* =========================
           FIND SELECTED PRODUCT
        ========================== */

        const selectedProduct =
          (window.products || []).find(
            product =>
              Number(product.id) ===
              productId
          );


        /* =========================
           PRODUCT NOT FOUND
        ========================== */

        if (!selectedProduct) {


          productDetails.innerHTML = `

            <div>

              <h1>
                Product Not Found
              </h1>


              <p>
                The product you are looking for
                could not be found.
              </p>


              <a
                href="index.html"
                class="button primary-button"
              >

                Return to Products

              </a>

            </div>

          `;


          recommendedGrid.innerHTML = "";


          return;

        }


        /* =========================
           PAGE TITLE
        ========================== */

        document.title =
          `${selectedProduct.name} | Habiye Limited`;


        /* =========================
           PRODUCT DETAILS CONTENT
        ========================== */

        productDetails.innerHTML = `

          <!-- PRODUCT IMAGE -->

          <div>

            <img
              class="product-main-image"
              src="${selectedProduct.image}"
              alt="${selectedProduct.name}"
            >

          </div>


          <!-- PRODUCT INFORMATION -->

          <div>


            <!-- CATEGORY -->

            <span class="product-category">

              ${selectedProduct.category}

            </span>


            <!-- TAG -->

            ${
              selectedProduct.tag
                ? `

                  <span class="product-tag">

                    ${selectedProduct.tag}

                  </span>

                `
                : ""
            }


            <!-- NAME -->

            <h1>

              ${selectedProduct.name}

            </h1>


            <!-- RATING -->

            <div class="rating">

              ★★★★★

              <span style="color:#667085;">

                ${selectedProduct.rating}

              </span>

            </div>


            <!-- DESCRIPTION -->

            <p class="description">

              ${selectedProduct.description}

            </p>


            <!-- FULL DETAILS -->

            <div class="product-full-details">

              <strong>

                Product Details

              </strong>


              <p>

                ${selectedProduct.details}

              </p>

            </div>


            <!-- PRICE -->

            <strong class="main-product-price">

              KSh ${Number(
                selectedProduct.price
              ).toLocaleString()}

            </strong>


            <!-- PURCHASE CONTROLS -->

            <div class="purchase-controls">


              <!-- QUANTITY -->

              <div class="quantity-control">


                <button
                  type="button"
                  id="decreaseQuantity"
                >

                  −

                </button>


                <span id="quantity">

                  1

                </span>


                <button
                  type="button"
                  id="increaseQuantity"
                >

                  +

                </button>


              </div>


              <!-- ADD TO CART -->

              <button
                type="button"
                class="button primary-button"
                id="addToCartButton"
              >

                Add to Cart

              </button>


            </div>


            <!-- CUSTOMIZATION -->

            <div class="customization-section">


              <h3>

                Customize This Product

              </h3>


              <div class="customization-placeholder">

                Product customization options
                will appear here based on the
                product.

                For example: color, storage
                capacity, RAM, accessories,
                configuration or other options.

              </div>


            </div>


          </div>

        `;


        /* =========================
           QUANTITY
        ========================== */

        let quantity = 1;


        const quantityDisplay =
          document.getElementById(
            "quantity"
          );


        const increaseQuantity =
          document.getElementById(
            "increaseQuantity"
          );


        const decreaseQuantity =
          document.getElementById(
            "decreaseQuantity"
          );


        /* =========================
           INCREASE QUANTITY
        ========================== */

        if (increaseQuantity) {

          increaseQuantity.addEventListener(
            "click",
            () => {

              quantity++;


              quantityDisplay.textContent =
                quantity;

            }
          );

        }


        /* =========================
           DECREASE QUANTITY
        ========================== */

        if (decreaseQuantity) {

          decreaseQuantity.addEventListener(
            "click",
            () => {

              if (quantity > 1) {

                quantity--;


                quantityDisplay.textContent =
                  quantity;

              }

            }
          );

        }


        /* =========================
           ADD MAIN PRODUCT TO CART
        ========================== */

        const addToCartButton =
          document.getElementById(
            "addToCartButton"
          );


        if (addToCartButton) {

          addToCartButton.addEventListener(
            "click",
            () => {


              if (
                window.HabiyeCart &&
                typeof window.HabiyeCart.addToCart ===
                  "function"
              ) {


                window.HabiyeCart.addToCart(
                  selectedProduct.id,
                  quantity
                );


              }

            }
          );

        }


        /* =========================
           FIND OTHER PRODUCTS
        ========================== */

        const otherProducts =
          window.products.filter(
            product =>
              Number(product.id) !==
              Number(selectedProduct.id)
          );


        /* =========================
           SAME CATEGORY
        ========================== */

        const sameCategory =
          otherProducts.filter(
            product =>
              product.category ===
              selectedProduct.category
          );


        /* =========================
           DIFFERENT CATEGORY
        ========================== */

        const differentCategory =
          otherProducts.filter(
            product =>
              product.category !==
              selectedProduct.category
          );


        /* =========================
           RECOMMENDATION LIST
           
           For now we display
           4 products.
        ========================== */

        const recommendedProducts = [

          ...sameCategory,

          ...differentCategory

        ].slice(0, 4);


        /* =========================
           RENDER RECOMMENDED PRODUCTS
           
           IMPORTANT:
           These use EXACTLY the same
           product-card classes used
           by index.html.
        ========================== */

        recommendedGrid.innerHTML =
          recommendedProducts
            .map(
              product => `


                <article class="product-card">


                  <!-- PRODUCT IMAGE -->

                  <div class="product-image-wrapper">


                    <img
                      class="product-image"
                      src="${product.image}"
                      alt="${product.name}"
                      loading="lazy"
                    >


                    ${
                      product.tag
                        ? `

                          <span class="product-tag">

                            ${product.tag}

                          </span>

                        `
                        : ""
                    }


                  </div>


                  <!-- PRODUCT CONTENT -->

                  <div class="product-card-content">


                    <!-- CATEGORY -->

                    <span class="product-category">

                      ${product.category}

                    </span>


                    <!-- PRODUCT NAME -->

                    <h3>

                      ${product.name}

                    </h3>


                    <!-- DESCRIPTION -->

                    <p class="product-description">

                      ${product.description}

                    </p>


                    <!-- RATING -->

                    <div class="product-rating">

                      ★★★★★

                      <span style="color:#667085;">

                        ${product.rating}

                      </span>

                    </div>


                    <!-- PRICE + BUTTONS -->

                    <div class="product-card-bottom">


                      <strong class="product-price">

                        KSh ${Number(
                          product.price
                        ).toLocaleString()}

                      </strong>


                      <!-- ACTION BUTTONS -->

                      <div class="product-actions">


                        <!-- VIEW -->

                        <button
                          type="button"
                          class="button secondary-button"
                          data-view-product="${product.id}"
                        >

                          View

                        </button>


                        <!-- ADD TO CART -->

                        <button
                          type="button"
                          class="button primary-button"
                          data-recommendation-cart="${product.id}"
                        >

                          Add to Cart

                        </button>


                      </div>


                    </div>


                  </div>


                </article>


              `
            )
            .join("");


        /* =========================
           RECOMMENDED PRODUCT ACTIONS
        ========================== */

        recommendedGrid.addEventListener(
          "click",
          event => {


            /* =========================
               VIEW PRODUCT
            ========================== */

            const viewButton =
              event.target.closest(
                "[data-view-product]"
              );


            if (viewButton) {


              const recommendationId =
                viewButton.dataset.viewProduct;


              window.location.href =
                `index2.html?id=${recommendationId}`;


              return;

            }


            /* =========================
               ADD RECOMMENDED PRODUCT
               TO CART
            ========================== */

            const cartButton =
              event.target.closest(
                "[data-recommendation-cart]"
              );


            if (!cartButton) {

              return;

            }


            const recommendationId =
              Number(
                cartButton.dataset
                  .recommendationCart
              );


            if (
              window.HabiyeCart &&
              typeof window.HabiyeCart.addToCart ===
                "function"
            ) {


              window.HabiyeCart.addToCart(
                recommendationId,
                1
              );


            }

          }
        );


      }

    );

  </script>


</body>

</html>
