<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product | Habiye Limited</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* =========================================================
       PRODUCT DETAIL PAGE
    ========================================================= */

    .product-page {
      padding: 40px 0 70px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 25px;
      color: var(--dark);
      text-decoration: none;
      font-weight: 700;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .product-details {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 45px;
      align-items: start;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 25px;
    }

    .product-detail-image-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: var(--radius);
      background: #f1f5f9;
    }

    .product-main-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-detail-info {
      min-width: 0;
    }

    .product-detail-tag {
      display: inline-block;
      margin-bottom: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #f97316;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .product-detail-category {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .product-detail-info h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      line-height: 1.2;
    }

    .product-detail-rating {
      margin: 0 0 18px;
      color: #f59e0b;
      font-size: 0.95rem;
    }

    .product-detail-rating span {
      color: var(--muted);
      margin-left: 5px;
    }

    .product-detail-description {
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .product-detail-price {
      display: block;
      font-size: 1.7rem;
      font-weight: 900;
      margin-bottom: 22px;
    }

    .purchase-controls {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .quantity-control {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
    }

    .quantity-control button {
      width: 42px;
      height: 42px;
      border: 0;
      background: #f8fafc;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
    }

    .quantity-control button:hover {
      background: #e2e8f0;
    }

    .quantity-control span {
      min-width: 45px;
      text-align: center;
      font-weight: 800;
    }

    .main-add-to-cart {
      min-height: 42px;
    }

    .product-full-details {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .product-full-details h3 {
      margin: 0 0 10px;
    }

    .product-full-details p {
      color: var(--muted);
      line-height: 1.7;
      margin: 0;
    }

    /* =========================================================
       RECOMMENDED PRODUCTS
    ========================================================= */

    .recommended-section {
      margin-top: 55px;
    }

    .section-heading {
      margin-bottom: 22px;
    }

    .section-heading h2 {
      margin: 0 0 7px;
    }

    .section-heading p {
      margin: 0;
      color: var(--muted);
    }

    .recommended-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px;
      align-items: stretch;
    }

    /* =========================================================
       ALL PRODUCTS
    ========================================================= */

    .all-products-section {
      margin-top: 65px;
    }

    .all-products-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 25px;
    }

    .all-products-header h2 {
      margin: 0 0 7px;
    }

    .all-products-header p {
      margin: 0;
      color: var(--muted);
    }

    .products-count {
      color: var(--muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    /*
      Uses the SAME .product-grid and .product-card classes
      from style.css used by index.html.
    */
    #allProductsGrid {
      width: 100%;
    }

    .load-more-wrapper {
      display: flex;
      justify-content: center;
      margin-top: 30px;
    }

    .load-more-button {
      min-width: 150px;
    }

    .no-products-message {
      padding: 30px;
      text-align: center;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (max-width: 1000px) {
      .recommended-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .product-details {
        grid-template-columns: 1fr 1fr;
        gap: 30px;
      }
    }

    @media (max-width: 760px) {
      .product-details {
        grid-template-columns: 1fr;
      }

      .recommended-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .all-products-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .products-count {
        white-space: normal;
      }
    }

    @media (max-width: 550px) {
      .product-page {
        padding-top: 25px;
      }

      .product-details {
        padding: 15px;
        gap: 25px;
      }

      .product-detail-info h1 {
        font-size: 1.5rem;
      }

      .product-detail-price {
        font-size: 1.4rem;
      }

      .recommended-grid {
        grid-template-columns: 1fr;
      }

      .purchase-controls {
        align-items: stretch;
        flex-direction: column;
      }

      .quantity-control {
        width: fit-content;
      }

      .main-add-to-cart {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div id="site-header"></div>

  <main class="product-page">

    <div class="container">

      <!-- BACK -->
      <a href="index.html" class="back-link">
        ← Back to Store
      </a>

      <!-- =====================================================
           SELECTED PRODUCT
      ====================================================== -->

      <section id="productDetails">
        <!-- Filled dynamically by JavaScript -->
      </section>


      <!-- =====================================================
           RECOMMENDED PRODUCTS
      ====================================================== -->

      <section
        id="recommendedSection"
        class="recommended-section"
        style="display: none;"
      >

        <div class="section-heading">
          <h2>You May Also Like</h2>
          <p>Products related to what you're currently viewing.</p>
        </div>

        <div
          id="recommendedGrid"
          class="recommended-grid"
        ></div>

      </section>


      <!-- =====================================================
           ALL PRODUCTS
      ====================================================== -->

      <section class="all-products-section">

        <div class="all-products-header">

          <div>
            <h2>Explore Our Products</h2>
            <p>Browse more products available in our store.</p>
          </div>

          <div
            id="productsCount"
            class="products-count"
          ></div>

        </div>

        <!--
          IMPORTANT:
          .product-grid and .product-card are the SAME classes
          used by index.html.
        -->
        <div
          id="allProductsGrid"
          class="product-grid"
        ></div>

        <div
          id="noProductsMessage"
          class="no-products-message"
          style="display: none;"
        >
          No products are available at the moment.
        </div>

        <div
          id="loadMoreWrapper"
          class="load-more-wrapper"
          style="display: none;"
        >
          <button
            type="button"
            id="loadMoreButton"
            class="button primary-button load-more-button"
          >
            Load More
          </button>
        </div>

      </section>

    </div>

  </main>


  <!-- FOOTER -->
  <div id="site-footer"></div>


  <!-- =======================================================
       EXISTING SITE SCRIPTS
  ======================================================== -->

  <script src="products.js"></script>
  <script src="components.js"></script>
  <script src="cart.js"></script>


  <!-- =======================================================
       PRODUCT PAGE SCRIPT
  ======================================================== -->

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const products = Array.isArray(window.products)
        ? window.products
        : [];

      const productDetails = document.getElementById("productDetails");
      const recommendedSection = document.getElementById("recommendedSection");
      const recommendedGrid = document.getElementById("recommendedGrid");

      const allProductsGrid = document.getElementById("allProductsGrid");
      const productsCount = document.getElementById("productsCount");
      const loadMoreWrapper = document.getElementById("loadMoreWrapper");
      const loadMoreButton = document.getElementById("loadMoreButton");
      const noProductsMessage = document.getElementById("noProductsMessage");


      /* =====================================================
         GET CURRENT PRODUCT
      ====================================================== */

      const urlParams = new URLSearchParams(window.location.search);
      const productId = Number(urlParams.get("id"));

      const selectedProduct = products.find(
        product => Number(product.id) === productId
      );


      /* =====================================================
         IF PRODUCT DOES NOT EXIST
      ====================================================== */

      if (!selectedProduct) {

        productDetails.innerHTML = `
          <div class="no-products-message">
            <h2>Product Not Found</h2>
            <p>
              The product you're looking for could not be found.
            </p>

            <br>

            <a href="index.html" class="button primary-button">
              Back to Store
            </a>
          </div>
        `;

        renderAllProducts();

        return;
      }


      /* =====================================================
         RENDER SELECTED PRODUCT
      ====================================================== */

      let quantity = 1;

      const productTag = selectedProduct.tag
        ? `<span class="product-detail-tag">${selectedProduct.tag}</span>`
        : "";

      const rating = selectedProduct.rating || 0;

      const ratingCount =
        selectedProduct.ratingCount ||
        selectedProduct.reviews ||
        "";

      productDetails.innerHTML = `

        <div class="product-details">

          <div class="product-detail-image-wrapper">

            <img
              src="${selectedProduct.image}"
              alt="${selectedProduct.name}"
              class="product-main-image"
              onerror="this.src='https://via.placeholder.com/600x600?text=Product+Image';"
            >

          </div>


          <div class="product-detail-info">

            ${productTag}

            <span class="product-detail-category">
              ${selectedProduct.category || "Product"}
            </span>

            <h1>
              ${selectedProduct.name}
            </h1>

            <div class="product-detail-rating">
              ★★★★★
              ${
                ratingCount
                  ? `<span>${ratingCount}</span>`
                  : ""
              }
            </div>

            <p class="product-detail-description">
              ${selectedProduct.description || ""}
            </p>

            <strong class="product-detail-price">
              KSh ${Number(selectedProduct.price || 0).toLocaleString()}
            </strong>


            <div class="purchase-controls">

              <div class="quantity-control">

                <button
                  type="button"
                  id="decreaseQuantity"
                  aria-label="Decrease quantity"
                >
                  −
                </button>

                <span id="quantityValue">
                  1
                </span>

                <button
                  type="button"
                  id="increaseQuantity"
                  aria-label="Increase quantity"
                >
                  +
                </button>

              </div>


              <button
                type="button"
                id="mainAddToCart"
                class="button primary-button main-add-to-cart"
              >
                Add to Cart
              </button>

            </div>


            <div class="product-full-details">

              <h3>
                Product Details
              </h3>

              <p>
                ${selectedProduct.description || "More information about this product will be available soon."}
              </p>

            </div>

          </div>

        </div>
      `;


      /* =====================================================
         QUANTITY CONTROLS
      ====================================================== */

      const quantityValue =
        document.getElementById("quantityValue");

      const decreaseQuantity =
        document.getElementById("decreaseQuantity");

      const increaseQuantity =
        document.getElementById("increaseQuantity");


      decreaseQuantity.addEventListener("click", function () {

        if (quantity > 1) {
          quantity--;
          quantityValue.textContent = quantity;
        }

      });


      increaseQuantity.addEventListener("click", function () {

        quantity++;
        quantityValue.textContent = quantity;

      });


      /* =====================================================
         MAIN PRODUCT ADD TO CART
      ====================================================== */

      const mainAddToCart =
        document.getElementById("mainAddToCart");


      mainAddToCart.addEventListener("click", function () {

        if (
          window.HabiyeCart &&
          typeof window.HabiyeCart.addToCart === "function"
        ) {

          window.HabiyeCart.addToCart(
            selectedProduct.id,
            quantity
          );

        }

      });


      /* =====================================================
         RECOMMENDATIONS
         SIMPLE SYSTEM — NO RECOMMENDATION ENGINE
      ====================================================== */

      const otherProducts = products.filter(
        product =>
          Number(product.id) !== Number(selectedProduct.id)
      );


      const sameCategory = otherProducts.filter(
        product =>
          product.category &&
          selectedProduct.category &&
          product.category === selectedProduct.category
      );


      const differentCategory = otherProducts.filter(
        product =>
          !product.category ||
          !selectedProduct.category ||
          product.category !== selectedProduct.category
      );


      const recommendedProducts = [
        ...sameCategory,
        ...differentCategory
      ].slice(0, 4);


      if (recommendedProducts.length > 0) {

        recommendedSection.style.display = "block";

        recommendedGrid.innerHTML =
          recommendedProducts
            .map(renderProductCard)
            .join("");

      }


      /* =====================================================
         RECOMMENDATION BUTTONS
      ====================================================== */

      recommendedGrid.addEventListener(
        "click",
        function (event) {

          const viewButton =
            event.target.closest("[data-view-product]");

          const cartButton =
            event.target.closest("[data-recommendation-cart]");


          /* VIEW */

          if (viewButton) {

            const id =
              Number(viewButton.dataset.viewProduct);

            window.location.href =
              `index2.html?id=${id}`;

            return;
          }


          /* ADD TO CART */

          if (cartButton) {

            const id =
              Number(cartButton.dataset.recommendationCart);

            if (
              window.HabiyeCart &&
              typeof window.HabiyeCart.addToCart === "function"
            ) {

              window.HabiyeCart.addToCart(id, 1);

            }

          }

        }
      );


      /* =====================================================
         DEVICE-BASED INITIAL PRODUCT COUNT
      ====================================================== */

      function getInitialProductCount() {

        const width = window.innerWidth;

        /*
          Large desktop:
          30 products

          Tablet / smaller laptop:
          20 products

          Mobile:
          12 products
        */

        if (width >= 1001) {
          return 30;
        }

        if (width >= 551) {
          return 20;
        }

        return 12;
      }


      /* =====================================================
         PRODUCT LIST STATE
      ====================================================== */

      let visibleProductCount =
        getInitialProductCount();


      /*
        Products already shown in the recommendation
        section are NOT removed from this list.

        This section represents the complete store catalogue.
      */

      const allStoreProducts = createSmartProductOrder(products, selectedProduct);

      function createSmartProductOrder(productList, currentProduct) {

  const remainingProducts = productList.filter(
    product =>
      Number(product.id) !== Number(currentProduct?.id)
  );

  const categories = [
    ...new Set(
      remainingProducts
        .map(product => product.category)
        .filter(Boolean)
    )
  ];

  const productsByCategory = {};

  categories.forEach(category => {
    productsByCategory[category] =
      remainingProducts.filter(
        product => product.category === category
      );
  });


  /*
    Shuffle each category independently.
  */
  Object.keys(productsByCategory).forEach(category => {

    productsByCategory[category] =
      shuffleArray(productsByCategory[category]);

  });


  /*
    Take products from different categories
    one by one instead of taking 30 from one category.
  */
  const result = [];

  let productsRemaining = true;

  while (productsRemaining) {

    productsRemaining = false;

    for (const category of categories) {

      if (
        productsByCategory[category] &&
        productsByCategory[category].length > 0
      ) {

        result.push(
          productsByCategory[category].shift()
        );

        productsRemaining = true;
      }

    }

  }


  return result;
}


/*
  Fisher-Yates shuffle
*/
function shuffleArray(array) {

  const shuffled = [...array];

  for (
    let i = shuffled.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [
      shuffled[i],
      shuffled[j]
    ] = [
      shuffled[j],
      shuffled[i]
    ];
  }

  return shuffled;
}


      /* =====================================================
         RENDER ALL PRODUCTS
      ====================================================== */

      function renderAllProducts() {

        if (!allStoreProducts.length) {

          allProductsGrid.innerHTML = "";

          productsCount.textContent = "";

          noProductsMessage.style.display = "block";

          loadMoreWrapper.style.display = "none";

          return;
        }


        noProductsMessage.style.display = "none";


        const visibleProducts =
          allStoreProducts.slice(
            0,
            visibleProductCount
          );


        allProductsGrid.innerHTML =
          visibleProducts
            .map(renderProductCard)
            .join("");


        productsCount.textContent =
          `Showing ${visibleProducts.length} of ${allStoreProducts.length} products`;


        if (
          visibleProductCount <
          allStoreProducts.length
        ) {

          loadMoreWrapper.style.display = "flex";

        } else {

          loadMoreWrapper.style.display = "none";

        }

      }


      /* =====================================================
         LOAD MORE
      ====================================================== */

      loadMoreButton.addEventListener(
        "click",
        function () {

          const width = window.innerWidth;

          let loadAmount;


          if (width >= 1001) {

            loadAmount = 30;

          } else if (width >= 551) {

            loadAmount = 20;

          } else {

            loadAmount = 12;

          }


          visibleProductCount += loadAmount;


          if (
            visibleProductCount >
            allStoreProducts.length
          ) {

            visibleProductCount =
              allStoreProducts.length;

          }


          renderAllProducts();


          /*
            Keep the user's position around the newly
            loaded products instead of jumping to the top.
          */

          setTimeout(function () {

            const cards =
              allProductsGrid.querySelectorAll(
                ".product-card"
              );

            if (cards.length > 0) {

              const lastCard =
                cards[
                  Math.max(
                    0,
                    cards.length - loadAmount
                  )
                ];

              if (lastCard) {

                lastCard.scrollIntoView({
                  behavior: "smooth",
                  block: "center"
                });

              }

            }

          }, 100);

        }
      );


      /* =====================================================
         PRODUCT CARD
         SAME CLASSES USED BY index.html
      ====================================================== */

      function renderProductCard(product) {

        const tag = product.tag
          ? `<span class="product-tag">${product.tag}</span>`
          : "";


        const ratingCount =
          product.ratingCount ||
          product.reviews ||
          "";


        return `

          <article class="product-card">

            <div class="product-image-wrapper">

              <img
                class="product-image"
                src="${product.image}"
                alt="${product.name}"
                loading="lazy"
                onerror="this.src='https://via.placeholder.com/500x500?text=Product+Image';"
              >

              ${tag}

            </div>


            <div class="product-card-content">

              <span class="product-category">
                ${product.category || "Product"}
              </span>


              <h3>
                ${product.name}
              </h3>


              <p class="product-description">
                ${product.description || ""}
              </p>


              <div class="product-rating">

                ★★★★★

                ${
                  ratingCount
                    ? `<span>${ratingCount}</span>`
                    : ""
                }

              </div>


              <div class="product-card-bottom">

                <strong class="product-price">
                  KSh ${Number(product.price || 0).toLocaleString()}
                </strong>


                <div class="product-actions">

                  <button
                    type="button"
                    class="button secondary-button"
                    data-view-product="${product.id}"
                  >
                    View
                  </button>


                  <button
                    type="button"
                    class="button primary-button"
                    data-product-cart="${product.id}"
                  >
                    Add to Cart
                  </button>

                </div>

              </div>

            </div>

          </article>

        `;
      }


      /* =====================================================
         ALL PRODUCT BUTTONS
      ====================================================== */

      allProductsGrid.addEventListener(
        "click",
        function (event) {

          const viewButton =
            event.target.closest("[data-view-product]");

          const cartButton =
            event.target.closest("[data-product-cart]");


          /* VIEW */

          if (viewButton) {

            const id =
              Number(viewButton.dataset.viewProduct);

            window.location.href =
              `index2.html?id=${id}`;

            return;
          }


          /* ADD TO CART */

          if (cartButton) {

            const id =
              Number(cartButton.dataset.productCart);


            if (
              window.HabiyeCart &&
              typeof window.HabiyeCart.addToCart === "function"
            ) {

              window.HabiyeCart.addToCart(id, 1);

            }

          }

        }
      );


      /* =====================================================
         INITIAL PRODUCT LIST
      ====================================================== */

      renderAllProducts();

    });
  </script>

</body>
</html>
