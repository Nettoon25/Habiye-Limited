<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Product Details | Habiye Limited
  </title>

  <meta
    name="description"
    content="View detailed product information and recommendations from Habiye Limited."
  >

  <link
    rel="stylesheet"
    href="style.css"
  >


  <style>

    /* =========================
       PRODUCT DETAILS PAGE
    ========================== */

    .product-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 20px;
    }


    .back-link {
      display: inline-block;
      margin-bottom: 30px;
      text-decoration: none;
      font-weight: 600;
    }


    .product-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: start;
    }


    .product-main-image {
      width: 100%;
      max-height: 550px;
      object-fit: cover;
      border-radius: 16px;
      display: block;
    }


    .product-category {
      display: inline-block;
      margin-right: 10px;
      font-size: 14px;
      font-weight: 600;
    }


    .product-tag {
      display: inline-block;
      font-size: 14px;
      font-weight: 600;
    }


    .product-details h1 {
      margin: 15px 0;
      font-size: 42px;
      line-height: 1.15;
    }


    .rating {
      margin-bottom: 20px;
      font-size: 18px;
    }


    .description {
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 25px;
    }


    .product-full-details {
      margin-bottom: 25px;
      padding: 20px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.04);
    }


    .product-full-details strong {
      display: block;
      margin-bottom: 10px;
    }


    .product-full-details p {
      margin: 0;
      line-height: 1.7;
    }


    .price {
      display: block;
      font-size: 30px;
      margin-bottom: 25px;
    }


    .purchase-controls {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 35px;
    }


    .quantity-control {
      display: flex;
      align-items: center;
      gap: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 5px 10px;
    }


    .quantity-control button {
      border: none;
      background: transparent;
      font-size: 22px;
      cursor: pointer;
      padding: 5px 10px;
    }


    .quantity-control span {
      min-width: 25px;
      text-align: center;
      font-weight: 600;
    }


    .button {
      cursor: pointer;
    }


    .customization-section {
      margin-top: 30px;
    }


    .customization-section h3 {
      margin-bottom: 15px;
    }


    .customization-placeholder {
      padding: 20px;
      border: 1px dashed #ccc;
      border-radius: 12px;
      line-height: 1.7;
    }


    /* =========================
       RECOMMENDED PRODUCTS
    ========================== */

    .recommended-section {
      margin-top: 80px;
    }


    .section-heading {
      margin-bottom: 30px;
    }


    .recommended-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
    }


    .recommended-card {
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      border: 1px solid #eee;
    }


    .recommended-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }


    .recommended-info {
      padding: 18px;
    }


    .recommended-category {
      display: block;
      font-size: 13px;
      margin-bottom: 8px;
    }


    .recommended-info h3 {
      margin: 0 0 12px;
    }


    .recommended-price {
      display: block;
      margin-bottom: 15px;
    }


    .recommended-button {
      display: inline-block;
      text-decoration: none;
      font-weight: 600;
    }


    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 900px) {

      .product-details {
        grid-template-columns: 1fr;
      }


      .recommended-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }


    @media (max-width: 600px) {

      .product-page {
        padding: 40px 15px;
      }


      .product-details h1 {
        font-size: 32px;
      }


      .purchase-controls {
        flex-direction: column;
        align-items: stretch;
      }


      .quantity-control {
        justify-content: center;
      }


      .recommended-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       DYNAMIC HEADER
  ========================== -->

  <div id="site-header"></div>


  <!-- =========================
       PRODUCT PAGE
  ========================== -->

  <main class="product-page">


    <a
      href="index.html"
      class="back-link"
    >
      ← Back to Products
    </a>


    <!-- =========================
         PRODUCT DETAILS
    ========================== -->

    <section
      class="product-details"
      id="productDetails"
    >

      <!-- JavaScript inserts the selected product here -->

    </section>


    <!-- =========================
         RECOMMENDED PRODUCTS
    ========================== -->

    <section
      class="recommended-section"
      id="recommendedSection"
    >

      <div class="section-heading">

        <h2>
          You May Also Like
        </h2>

        <p>
          Explore more products from Habiye Limited.
        </p>

      </div>


      <div
        class="recommended-grid"
        id="recommendedGrid"
      >

        <!-- JavaScript inserts recommended products here -->

      </div>

    </section>

  </main>


  <!-- =========================
       DYNAMIC FOOTER
  ========================== -->

  <div id="site-footer"></div>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="products.js"></script>

  <script src="components.js"></script>

  <script src="cart.js"></script>


  <script>

    document.addEventListener(
      "DOMContentLoaded",
      () => {


        /* =========================
           PRODUCT DETAILS
        ========================== */

        const productDetails =
          document.getElementById(
            "productDetails"
          );


        const recommendedGrid =
          document.getElementById(
            "recommendedGrid"
          );


        const urlParams =
          new URLSearchParams(
            window.location.search
          );


        const productId =
          Number(
            urlParams.get("id")
          );


        const selectedProduct =
          window.products.find(
            product =>
              product.id === productId
          );


        /* =========================
           PRODUCT NOT FOUND
        ========================== */

        if (!selectedProduct) {

          productDetails.innerHTML = `

            <div>

              <h1>
                Product Not Found
              </h1>

              <p>
                The product you are looking for
                could not be found.
              </p>

              <a
                href="index.html"
                class="button primary-button"
              >
                Return to Products
              </a>

            </div>

          `;


          recommendedGrid.innerHTML = "";

          return;

        }


        /* =========================
           PAGE TITLE
        ========================== */

        document.title =
          `${selectedProduct.name} | Habiye Limited`;


        /* =========================
           PRODUCT CONTENT
        ========================== */

        productDetails.innerHTML = `

          <div>

            <img
              class="product-main-image"
              src="${selectedProduct.image}"
              alt="${selectedProduct.name}"
            >

          </div>


          <div>

            <span class="product-category">
              ${selectedProduct.category}
            </span>


            <span class="product-tag">
              ${selectedProduct.tag}
            </span>


            <h1>
              ${selectedProduct.name}
            </h1>


            <div class="rating">

              ★★★★★

              <span style="color:#667085;">
                ${selectedProduct.rating}
              </span>

            </div>


            <p class="description">
              ${selectedProduct.description}
            </p>


            <div class="product-full-details">

              <strong>
                Product Details
              </strong>

              <p>
                ${selectedProduct.details}
              </p>

            </div>


            <strong class="price">
              KSh ${selectedProduct.price.toLocaleString()}
            </strong>


            <div class="purchase-controls">


              <!-- =========================
                   QUANTITY
              ========================== -->

              <div class="quantity-control">

                <button
                  type="button"
                  id="decreaseQuantity"
                >
                  −
                </button>


                <span id="quantity">
                  1
                </span>


                <button
                  type="button"
                  id="increaseQuantity"
                >
                  +
                </button>

              </div>


              <!-- =========================
                   ADD TO CART
              ========================== -->

              <button
                type="button"
                class="button primary-button"
                id="addToCartButton"
              >
                Add to Cart
              </button>


            </div>


            <!-- =========================
                 CUSTOMIZATION
            ========================== -->

            <div class="customization-section">

              <h3>
                Customize This Product
              </h3>


              <div class="customization-placeholder">

                Product customization options
                will appear here based on the
                product.

                For example: color, storage
                capacity, RAM, accessories,
                configuration or other options.

              </div>

            </div>


          </div>

        `;


        /* =========================
           QUANTITY
        ========================== */

        let quantity = 1;


        const quantityDisplay =
          document.getElementById(
            "quantity"
          );


        const increaseQuantity =
          document.getElementById(
            "increaseQuantity"
          );


        const decreaseQuantity =
          document.getElementById(
            "decreaseQuantity"
          );


        increaseQuantity.addEventListener(
          "click",
          () => {

            quantity++;

            quantityDisplay.textContent =
              quantity;

          }
        );


        decreaseQuantity.addEventListener(
          "click",
          () => {

            if (quantity > 1) {

              quantity--;

              quantityDisplay.textContent =
                quantity;

            }

          }
        );


        /* =========================
           ADD TO SHARED CART
        ========================== */

        const addToCartButton =
          document.getElementById(
            "addToCartButton"
          );


        addToCartButton.addEventListener(
          "click",
          () => {

            if (
              window.HabiyeCart &&
              typeof HabiyeCart.addToCart ===
                "function"
            ) {

              HabiyeCart.addToCart(
                selectedProduct.id,
                quantity
              );

            }

          }
        );


        /* =========================
           RECOMMENDED PRODUCTS
        ========================== */

        const otherProducts =
          window.products.filter(
            product =>
              product.id !==
              selectedProduct.id
          );


        const sameCategory =
          otherProducts.filter(
            product =>
              product.category ===
              selectedProduct.category
          );


        const differentCategory =
          otherProducts.filter(
            product =>
              product.category !==
              selectedProduct.category
          );


        const recommendedProducts = [

          ...sameCategory,

          ...differentCategory

        ].slice(0, 4);


        recommendedGrid.innerHTML =
          recommendedProducts
            .map(
              product => `

                <article
                  class="recommended-card"
                >

                  <img
                    src="${product.image}"
                    alt="${product.name}"
                    loading="lazy"
                  >


                  <div class="recommended-info">

                    <span
                      class="recommended-category"
                    >
                      ${product.category}
                    </span>


                    <h3>
                      ${product.name}
                    </h3>


                    <strong
                      class="recommended-price"
                    >
                      KSh ${product.price.toLocaleString()}
                    </strong>


                    <a
                      href="index2.html?id=${product.id}"
                      class="recommended-button"
                    >
                      View Product
                    </a>

                  </div>

                </article>

              `
            )
            .join("");


      }

    );

  </script>


</body>

</html>
